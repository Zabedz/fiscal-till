services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    # No arm64 image exists; Docker Desktop runs it under Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # sqlcmd reads these: the SA password, and the journal_app password used by db/schema.sql.
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      JOURNAL_APP_PASSWORD: ${JOURNAL_APP_PASSWORD:?set JOURNAL_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - journal-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

volumes:
  journal-data:
